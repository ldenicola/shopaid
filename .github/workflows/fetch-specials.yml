name: ShopAid weekly specials

on:
  schedule:
    # Mondays 04:47 SAST (02:47 UTC) and Thursdays 04:47 SAST, so mid-week
    # promotions are picked up too
    - cron: "47 2 * * 1,4"
  workflow_dispatch: {}   # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: shopaid-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch specials and meal ideas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper/fetch_specials.py

      - name: Commit updated data
        run: |
          git config user.name "shopaid-bot"
          git config user.email "shopaid-bot@users.noreply.github.com"
          git add docs/data/specials.json docs/data/meals.json
          git diff --cached --quiet && exit 0
          git commit -m "Specials update $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main
          git push
